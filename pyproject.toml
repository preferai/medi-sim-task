[project]
name = "ecc1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.5",
    "httpx>=0.28.1",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.52.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.uv]
package = false
